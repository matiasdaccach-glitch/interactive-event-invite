<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invitación</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="invite">
    <div class="date">Sábado · 7:00 p. m.</div>
    <h1>Noche de estrellas</h1>
    <p>Te invitamos a una velada para compartir comida, música y buenos momentos.</p>
    <p>📍 Terraza del jardín<br>📅 12 de diciembre</p>

    <div class="actions">
      <button class="yes" data-answer="¡Qué alegría! Te esperamos ✨">
        Confirmar asistencia
      </button>
      <button class="no" data-answer="Gracias por avisar. ¡Te extrañaremos!">
        No podré asistir
      </button>
    </div>

    <p id="reply" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
